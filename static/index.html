<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Nscan Operations Console</title>
  <link rel="icon" href="/static/logos/nscan.png?v=20260622" type="image/png">
  <link rel="apple-touch-icon" href="/static/logos/nscan.png?v=20260622">
  <link rel="stylesheet" href="/static/css/app.css?v=20260623-parallel">
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <a class="skip-link" href="#pageContent">Skip to content</a>
  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <div class="brand-row">
        <div class="brand-mark image-mark" aria-hidden="true">
          <img class="brand-logo-image" src="/static/logos/nscan.png" alt="">
        </div>
        <div class="brand-copy">
          <strong>Nscan</strong>
          <span>Operations Console</span>
        </div>
        <button class="icon-button sidebar-collapse" id="sidebarCollapse" type="button" title="Collapse navigation" aria-label="Collapse navigation"></button>
      </div>
      <nav class="primary-nav" id="primaryNav"></nav>
      <div class="sidebar-footer">
        <div class="service-indicator"><span class="status-dot ok"></span><span class="nav-label">Console online</span></div>
        <button class="icon-button" id="themeToggle" type="button" title="Toggle color theme" aria-label="Toggle color theme"></button>
      </div>
    </aside>

    <button class="mobile-overlay" id="mobileOverlay" type="button" aria-label="Close navigation"></button>

    <main class="main-shell">
      <header class="topbar">
        <div class="topbar-leading">
          <button class="icon-button mobile-menu" id="mobileMenu" type="button" title="Open navigation" aria-label="Open navigation"></button>
          <div>
            <div class="page-heading-row">
              <h1 id="pageTitle">Overview</h1>
              <span class="freshness" id="freshnessLabel" aria-live="polite">Loading</span>
            </div>
            <p id="pageSubtitle">Live scan posture and operational alerts</p>
          </div>
        </div>
        <div class="topbar-actions" id="topbarActions">
          <button class="button secondary" id="refreshButton" type="button"></button>
        </div>
      </header>
      <section class="page-content" id="pageContent" tabindex="-1" aria-live="polite"></section>
    </main>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
    <header class="drawer-header">
      <div><h2 id="drawerTitle">Details</h2><p id="drawerSubtitle"></p></div>
      <button class="icon-button" id="drawerClose" type="button" aria-label="Close panel"></button>
    </header>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <dialog class="confirm-dialog" id="confirmDialog">
    <form method="dialog">
      <h2 id="confirmTitle">Confirm action</h2>
      <p id="confirmMessage"></p>
      <div class="dialog-actions">
        <button class="button secondary" value="cancel">Cancel</button>
        <button class="button danger" id="confirmAccept" value="confirm">Confirm</button>
      </div>
    </form>
  </dialog>

  <div class="toast-region" id="toastRegion" aria-live="assertive"></div>
  <script type="module" src="/static/js/app.js?v=20260630-stability2"></script>
</body>
</html>
